<section class="settings-page">
	<h1>Settings</h1>
	<p>Configure minimum market quality thresholds used by the scanner decision engine.</p>

	<div class="settings-grid">
		<mat-form-field appearance="outline">
			<mat-label>Minimum Market Cap (USD)</mat-label>
			<input matInput type="number" [(ngModel)]="minimumMarketCapUsd" min="0" step="1000000" />
		</mat-form-field>

		<mat-form-field appearance="outline">
			<mat-label>Minimum 24h Volume (USD)</mat-label>
			<input matInput type="number" [(ngModel)]="minimumVolume24hUsd" min="0" step="1000000" />
		</mat-form-field>
	</div>

	<div class="settings-actions">
		<button mat-flat-button type="button" (click)="save()">Save</button>
		<button mat-stroked-button type="button" (click)="reset()">Reset</button>
	</div>

	@if (saved()) {
		<p>Scanner thresholds saved. Run a fresh scan to apply them.</p>
	}
</section>
